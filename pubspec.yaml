name: self_order_apps
description: "Aplikasi Pemesanan & Kasir Berbasis QR Code (Flutter Android/Web, Supabase & Xendit Test Mode)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.4
  google_fonts: ^6.2.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.7
  image_picker: ^1.1.2
  image: ^4.3.0
  intl: ^0.20.2
  excel: ^4.0.6
  pdf: ^3.11.2
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  path_provider_foundation: "<2.6.0"
  path_provider_android: "<2.3.0"

flutter:
  uses-material-design: true
